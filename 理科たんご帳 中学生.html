const F=["物理","化学","生物","地学"];
W.sort((a,b)=>F.indexOf(a[0])-F.indexOf(b[0]));W.forEach((w,i)=>w[4]=i+1);
let S={fav:[],wrong:[],best:0};
try{const r=localStorage.getItem("rika_s");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("rika_s",JSON.stringify(S))}catch(e){}};
let V={t:"quiz",f:"全て",q:null};
const $=document.getElementById("app");
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const isF=t=>S.fav.includes(t);
function fav(t){S.fav=isF(t)?S.fav.filter(x=>x!==t):[...S.fav,t];save();render()}
function start(list,label){
  if(!list.length){alert("対象の単語がありません");return}
  const l=sh(list).slice(0,10).map(w=>({w,c:sh([w,...sh(W.filter(x=>x[0]===w[0]&&x!==w)).slice(0,3)])}));
  V.q={l,i:0,sel:null,res:[],label};render()}
function pick(k){const q=V.q,it=q.l[q.i],ok=it.c[k]===it.w;q.sel=k;q.res.push({w:it.w,ok});
  if(ok)S.wrong=S.wrong.filter(x=>x!==it.w[1]);else if(!S.wrong.includes(it.w[1]))S.wrong.push(it.w[1]);
  save();render()}
function next(){const q=V.q;q.sel=null;q.i++;if(q.i>=q.l.length){const n=q.res.filter(r=>r.ok).length;S.best=Math.max(S.best,n);save()}render()}
const byName=n=>W.find(w=>w[1]===n);
const star=t=>`<button class="star ${isF(t)?"on":""}" aria-label="お気に入り" onclick="fav('${t}')">★</button>`;
function head(){return `<h1>理科たんご帳</h1><p class="sub">千葉県の高校入試でよく出る中学理科の用語</p>
<div class="tabs">${[["quiz","テスト"],["list","単語帳"]].map(([k,n])=>`<button class="${V.t===k?"on":""}" onclick="V.t='${k}';V.q=null;render()">${n}</button>`).join("")}</div>`}
function quizHome(){
  const wl=S.wrong.map(byName).filter(Boolean),fl=S.fav.map(byName).filter(Boolean);
  window.go=(m)=>{const lists={all:W,wrong:wl,fav:fl};
    if(F.includes(m))start(W.filter(w=>w[0]===m),m+"の問題");
    else start(lists[m],{all:"ぜんぶ",wrong:"間違えた単語の再テスト",fav:"お気に入りテスト"}[m])};
  return `<div class="box"><b>10問ずつ出題</b><p class="sub" style="margin:0">説明を読んで、あてはまる用語を選ぼう。正解は◎、不正解は×。</p></div>
<div class="row"><button class="pri" onclick="go('all')">ぜんぶからテスト</button>
${F.map(f=>`<button onclick="go('${f}')">${f}</button>`).join("")}</div>
<div class="box"><b>復習</b>
<div class="row" style="margin-top:8px"><button onclick="go('wrong')" ${wl.length?"":"disabled"}><span class="bad">×</span> 間違えた単語 (${wl.length})</button>
<button onclick="go('fav')" ${fl.length?"":"disabled"}>★ お気に入り (${fl.length})</button></div>
<p class="sub" style="margin:8px 0 0">再テストで正解すると、間違いリストから消えます。ベスト：${S.best}/10</p></div>`}
function quizView(){
  const q=V.q;
  if(q.i>=q.l.length){const bad=q.res.filter(r=>!r.ok),n=q.res.length-bad.length;
    return `<div class="box"><div class="sub">${q.label}</div><div class="mark ${bad.length?"ng":"ok"}">${n} / ${q.res.length}</div>
${bad.length?`<b class="bad">×の単語</b>`+bad.map(r=>`<div class="w">${star(r.w[1])}<div><small>No.${r.w[4]}</small> <b>${r.w[1]}</b> <small>${r.w[2]}</small><br>${r.w[3]}</div></div>`).join(""):`<p><b>全問正解！◎</b></p>`}</div>
<div class="row">${bad.length?`<button class="pri" onclick="start(V.q.res.filter(r=>!r.ok).map(r=>r.w),'今回の間違いの再テスト')">間違えた単語を再テスト</button>`:""}<button onclick="V.q=null;render()">もどる</button></div>`}
  const it=q.l[q.i],a=q.sel!==null,ok=a&&it.c[q.sel]===it.w;
  return `<div class="bar"><i style="width:${q.i/q.l.length*100}%"></i></div>
<p class="sub">${q.label}　${q.i+1} / ${q.l.length}　<span class="tag">No.${it.w[4]}</span> <span class="tag">${it.w[0]}</span></p>
<div class="box"><div class="q">${it.w[3].replace(/。?(.*)/,"$&")}<br>とは？</div></div>
${a?`<div class="mark ${ok?"ok":"ng"}" role="status">${ok?"◎":"×"}</div>`:""}
${it.c.map((c,k)=>{let cl="";if(a){if(c===it.w)cl="ok";else if(k===q.sel)cl="ng"}
 return `<button class="ch ${cl}" ${a?"disabled":""} onclick="pick(${k})">${c[1]}</button>`}).join("")}
${a?`<div class="box">正解：<small>No.${it.w[4]}</small> <b>${it.w[1]}</b> <small>${it.w[2]}</small> ${star(it.w[1])}</div><button class="pri ch" style="text-align:center" onclick="next()">${q.i+1<q.l.length?"次の問題":"結果を見る"}</button>`:""}`}
function listView(){
  const fs=["全て","★","×",...F];
  const L=W.filter(w=>V.f==="全て"||(V.f==="★"?isF(w[1]):V.f==="×"?S.wrong.includes(w[1]):w[0]===V.f));
  return `<div class="chips">${fs.map(f=>`<button class="${V.f===f?"on":""}" onclick="V.f='${f}';render()">${f}</button>`).join("")}</div>
<div class="box">${L.length?L.map(w=>`<div class="w">${star(w[1])}<div><span class="tag">No.${w[4]}</span> <span class="tag">${w[0]}</span> <b>${w[1]}</b> <small>${w[2]}</small>${S.wrong.includes(w[1])?' <span class="bad">×</span>':""}<br>${w[3]}</div></div>`).join(""):"該当する単語はまだありません。"}</div>`}
function render(){
  $.innerHTML=head()+(V.t==="list"?listView():V.q?quizView():quizHome());window.scrollTo(0,0)}
render();
